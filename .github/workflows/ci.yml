name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jampack
          POSTGRES_PASSWORD: jampack
          POSTGRES_DB: jampack
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://jampack:jampack@localhost:5432/jampack?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jampack/db exec prisma generate
      - run: pnpm --filter @jampack/db exec prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm test:cov
      - run: pnpm build
