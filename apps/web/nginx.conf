# Zones de limitation de débit (défense en profondeur).
# - public : route publique NON authentifiée (signature de devis) → limite stricte anti-abus/bruteforce.
# - api    : reste de l'API → limite large (protection DoS basique).
limit_req_zone $binary_remote_addr zone=public:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # En-têtes de sécurité de base (durcir la CSP selon les besoins réels).
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Résolution DNS Docker à la volée : nginx ne résout pas l'upstream « app » au
  # démarrage (sinon il refuse de booter si l'API n'est pas encore prête), mais à
  # la requête — la stack est ainsi résiliente à l'ordre de démarrage des conteneurs.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Route PUBLIQUE de signature du devis (non authentifiée) → limite stricte.
  # tRPC expose les procédures par leur chemin : /trpc/publicQuote.get|accept|decline
  location ~ ^/trpc/publicQuote\. {
    limit_req zone=public burst=5 nodelay;
    set $jampack_api app:3000;
    proxy_pass http://$jampack_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # API tRPC → conteneur "app"
  location /trpc/ {
    limit_req zone=api burst=60 nodelay;
    set $jampack_api app:3000;
    proxy_pass http://$jampack_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA React (react-router) → fallback index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
