server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Résolution DNS Docker à la volée : nginx ne résout pas l'upstream « app » au
  # démarrage (sinon il refuse de booter si l'API n'est pas encore prête), mais à
  # la requête — la stack est ainsi résiliente à l'ordre de démarrage des conteneurs.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # API tRPC → conteneur "app"
  location /trpc/ {
    set $jampack_api app:3000;
    proxy_pass http://$jampack_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA React (react-router) → fallback index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
