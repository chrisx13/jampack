services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jampack
      POSTGRES_PASSWORD: jampack
      POSTGRES_DB: jampack
    ports: ["5432:5432"]
    volumes: ["jampack_pg:/var/lib/postgresql/data"]
  adminer:
    image: adminer
    ports: ["8080:8080"]
volumes:
  jampack_pg:
