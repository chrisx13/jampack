# CI conteneurisée JAMPACK (pas de GitHub Actions) : Postgres éphémère + runner qui rejoue tout le
# pipeline (voir ci/run.sh). Lancer :
#   docker compose -f docker-compose.ci.yml up --build --abort-on-container-exit --exit-code-from ci
#   docker compose -f docker-compose.ci.yml down -v
# ou simplement : scripts/ci.sh
name: jampack-ci

services:
  ci-db:
    image: postgres:16
    environment:
      POSTGRES_USER: jampack
      POSTGRES_PASSWORD: jampack
      POSTGRES_DB: jampack
    # Base en mémoire (tmpfs) : rapide et jetable — la CI repart d'un état propre à chaque run.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jampack"]
      interval: 5s
      timeout: 5s
      retries: 12

  ci:
    build:
      context: .
      target: ci
    depends_on:
      ci-db:
        condition: service_healthy
    environment:
      DB_HOST: ci-db
      DATABASE_URL: postgresql://jampack:jampack@ci-db:5432/jampack?schema=public
      APP_DB_PASSWORD: jampack
